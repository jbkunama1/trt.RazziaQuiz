version: '3.8'

services:
  razzia-quiz:
    image: ghcr.io/jbkunama1/trt.razziaquiz:latest
    container_name: razzia-quiz
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      - WEB_ORIGIN=http://localhost:8092
      - SOCKET_URL=http://localhost:8092
      - PORT=8092
    volumes:
      - razzia_quiz_config:/app/config
    networks:
      - highfishNetwork
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  razzia_quiz_config:
    driver: local

networks:
  highfishNetwork:
    external: true
    name: highfishNetwork
